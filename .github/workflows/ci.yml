name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rokit tools
        uses: CompeyDev/setup-rokit@v0.2.1

      - name: Lint
        run: selene src tests

      - name: Format check
        run: stylua --check src tests

      - name: Unit tests
        run: lune run tests/run

      - name: Build place
        run: rojo build default.project.json -o RoboVac.rbxl

      - name: Upload place
        uses: actions/upload-artifact@v4
        with:
          name: RoboVac
          path: RoboVac.rbxl
          if-no-files-found: error
